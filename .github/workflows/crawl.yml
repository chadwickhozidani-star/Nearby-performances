name: Daily Concert Crawl

on:
  schedule:
    # 每天 06:00 (UTC) = 北京时间 14:00，避开高峰
    - cron: "0 6 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_SITE_URL: ${{ secrets.FEISHU_SITE_URL }}
        run: |
          python crawler/crawl.py --output data

      - name: Copy data to web public
        run: |
          mkdir -p web/public/data
          cp data/events.json web/public/data/events.json
          cp data/meta.json web/public/data/meta.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/events.json web/public/data/meta.json
          git diff --cached --quiet || git commit -m "chore: daily concert data update $(date +'%Y-%m-%d')"
          git push
